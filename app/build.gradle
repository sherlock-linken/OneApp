apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.witbit.sherlock.oneapp"
    compileSdkVersion 36
//    buildToolsVersion androidBuildToolsVersion

    defaultConfig {
        applicationId "com.witbit.sherlock.oneapp"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 110
        versionName "1.1.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {// 自己的签名文件
            storeFile file("oneApp.jks")
            storePassword "sherlock"
            keyAlias "oneApp"
            keyPassword "sherlock"
        }
    }

    buildTypes {
        release {
            zipAlignEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        incremental = true  //开启增量编译
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Add Kotlin JVM target configuration
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lintOptions {
        checkDependencies true
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation', 'CheckResult'
    }

    buildFeatures {
        dataBinding true
    }

//    buildToolsVersion '26.0.2'

    // 添加以下配置强制使用兼容的依赖版本
    configurations.all {
        resolutionStrategy {
            // 强制使用与 compileSdk 31 兼容的版本
            force 'androidx.appcompat:appcompat:1.4.2'
            force 'androidx.appcompat:appcompat-resources:1.4.2'
            force 'com.google.android.material:material:1.6.1'
            force 'androidx.emoji2:emoji2:1.0.0'
            force 'androidx.emoji2:emoji2-views-helper:1.0.0'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
//    implementation project(':Android-ViewPagerIndicator')

    // 替换 Android Support 库为 AndroidX
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 更新 RxJava 和 Retrofit
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    // 更新 Dagger 到支持 AndroidX 的版本
    implementation 'com.google.dagger:dagger:2.44.2'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.activity:activity:1.5.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.44.2'

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.5.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.5.1"

    // 移除 javax.annotation-api，使用 AndroidX 注解
    implementation 'androidx.annotation:annotation:1.6.0'

}
